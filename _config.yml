# Site Settings
title: Chandra | Portfolio
author: Chandra
email: your-email@example.com
description: >-
  Personal portfolio, projects, and notes by Chandra. 
  Student, developer, and builder.

# Theme Selection
# Choose one of the official themes:
# minima, cayman, slate, hacker, architect, dinky, midnight, modernist
theme: minima

# URL Settings (Optional - leave blank if just starting out)
# url: "https://meetchandra.me" # or "https://<your-username>.github.io"
# baseurl: ""

# Social Profiles (Supported by themes like Minima)
github_username: your-github-username
linkedin_username: your-linkedin-username
twitter_username: your-twitter-handle

# GitHub Pages Plugins (Supported out of the box)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown Parser
markdown: kramdown
